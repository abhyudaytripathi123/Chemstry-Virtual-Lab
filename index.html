<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIT-WPU Virtual ChemLab - CHM10011</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-slow { animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden">

    <!-- Top Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 p-2 rounded-xl text-white shadow-lg shadow-emerald-900/30">
                <i data-lucide="flask-conical" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white tracking-tight">MIT-WPU Virtual ChemLab</h1>
                <p class="text-xs text-slate-400">Course: CHM10011 | F.Y. B.Tech (2026-27)[cite: 1]</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="bg-slate-700/60 border border-slate-600/60 rounded-lg px-3 py-1.5 flex items-center space-x-2 text-xs text-slate-300">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
                <span>Safety Protocols Active[cite: 3]</span>
            </div>
            <button onclick="exportCurrentReport()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 transition shadow-md shadow-emerald-900/20">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Export Report PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-80 bg-slate-800/90 border-r border-slate-700 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-700/80">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center space-x-2">
                    <i data-lucide="list" class="w-4 h-4 text-emerald-400"></i>
                    <span>List of Laboratory Experiments</span>
                </h2>
                <p class="text-[11px] text-slate-400 mt-0.5">MIT-WPU Chemistry Manual 2026-27[cite: 1]</p>
            </div>
            <nav id="experimentNav" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1.5">
                <!-- Experiment List populated dynamically -->
            </nav>
        </aside>

        <!-- Content Workspace Area -->
        <main class="flex-1 flex flex-col bg-slate-900 overflow-y-auto custom-scrollbar p-6">
            <div id="experimentWorkspace" class="max-w-5xl mx-auto w-full space-y-6">
                <!-- Active Experiment View -->
            </div>
        </main>
    </div>

    <!-- Application JavaScript with Complete Step-by-Step Animations -->
    <script>
        const experiments = [
            {
                id: 1,
                title: "Determination of the molecular weight of a polymer by using Ostwald's Viscometer",
                objective: "To determine the molecular weight of polymer by using Ostwald Viscometer[cite: 7].",
                theory: "Ostwald's Viscometer measures dynamic solution viscosity. The Mark-Houwink equation $[\eta] = K \cdot M^\alpha$ relates intrinsic viscosity to molecular weight $M$[cite: 7].",
                chemicals: "Distilled water, Polyvinyl Alcohol (PVA) & Acetone[cite: 7].",
                apparatus: "Viscometer, stopwatch, rubber bulb, pipette, iron stand & measuring cylinder[cite: 7]."
            },
            {
                id: 2,
                title: "Preparation of nylon 6, 10 and to draw them in the form of thread",
                objective: "To prepare nylons by interfacial polymerization technique where monomers react at the liquid-liquid interface to form a draw-able polymer rope[cite: 13].",
                theory: "Step-growth interfacial polycondensation between hexamethylene diamine (aqueous) and sebacoyl chloride (in $\text{CCl}_4$)[cite: 13, 14]. Known as the Nylon Rope Trick[cite: 13].",
                chemicals: "Sebacoyl chloride, Hexamethylene diamine, $\text{CCl}_4$, Distilled water & Methanol[cite: 13].",
                apparatus: "250 ml Beakers, glass rod, test tube & tweezers[cite: 13, 14]."
            },
            {
                id: 3,
                title: "Determination of iron concentration in a given sample using colorimeter",
                objective: "To determine the concentration of iron present in water by spectrophotometric measurements using Beer-Lambert's law[cite: 19, 20].",
                theory: "Iron (III) reacts with thiocyanate to form an intensely red coloured $[\text{Fe}(\text{SCN})_3]$ complex measured at $\lambda_{max} = 450-460\text{ nm}$[cite: 20].",
                chemicals: "Ammonium thiocyanate, ferrous ammonium sulphate, conc. $\text{HNO}_3$ and $\text{H}_2\text{SO}_4$[cite: 19].",
                apparatus: "Colorimeter, Volumetric flasks (50 ml), Burette, Cuvette[cite: 19]."
            },
            {
                id: 4,
                title: "Demonstration of effect of environmental conditions on metal corrosion",
                objective: "To understand the effect of acidic environment of different concentrations on corrosion of metal (mild steel/zinc)[cite: 27, 29].",
                theory: "Wet or electrochemical corrosion occurs in acidic media where iron acts as anode undergoing oxidation while hydrogen evolution takes place at the cathodic site[cite: 27].",
                chemicals: "Sulphuric acid ($\text{H}_2\text{SO}_4$) & Water[cite: 27].",
                apparatus: "50 ml Beakers, metal plates (Fe/Zn) & sandpaper[cite: 27, 29]."
            },
            {
                id: 5,
                title: "Determination of % moisture, volatile matter and ash content in coal sample",
                objective: "Proximate analysis of coal to determine moisture ($110^\circ\text{C}$), volatile matter, and ash content ($750^\circ\text{C}$) to assess fuel quality[cite: 34].",
                theory: "Moisture is lost at $110^\circ\text{C}$[cite: 34], volatile matter evolves upon closed heating, and ash residue remains after complete combustion at $750^\circ\text{C}$[cite: 34].",
                chemicals: "Coal sample, anhydrous calcium chloride[cite: 34].",
                apparatus: "Silica Crucible, Desiccator, Electric Oven, Muffle furnace[cite: 34]."
            },
            {
                id: 6,
                title: "To determine the equivalence point of neutralization of Acetic Acid with Sodium Hydroxide by pH meter",
                objective: "To determine the equivalence point of $\text{CH}_3\text{COOH}$ vs $\text{NaOH}$ titration and find unknown concentration using pH metric titration[cite: 39].",
                theory: "Combination of glass electrode and saturated calomel electrode (SCE) measures potential variation responding to $\text{H}^+$ activity, yielding a sigmoidal neutralization curve[cite: 39, 40, 41].",
                chemicals: "Acetic Acid ($\text{CH}_3\text{COOH}$), Sodium Hydroxide ($\text{NaOH}$) & Buffer solutions[cite: 39, 41].",
                apparatus: "pH Meter, Glass electrode, Calomel electrode, Burette[cite: 39, 40, 41]."
            },
            {
                id: 7,
                title: "Separation of mixture of organic compounds by Thin Layer Chromatography",
                objective: "To separate a mixture of organic compounds by TLC and calculate retention factor ($R_f$) values[cite: 47, 48].",
                theory: "Components separate based on differential adsorption affinity between a polar stationary phase (silica gel) and a non-polar mobile phase (eluent)[cite: 47].",
                chemicals: "Organic mixture, Silica Gel, Chloroform, Benzene, Iodine crystals[cite: 47].",
                apparatus: "Glass Cylinder (TLC chamber), Glass plates ($20\times 4\text{ cm}$), Capillary tube[cite: 47]."
            },
            {
                id: 8,
                title: "Kinetics of acid catalyzed the hydrolysis of an ester",
                objective: "To determine the rate constant of acid-catalyzed hydrolysis of ethyl acetate[cite: 53, 54].",
                theory: "A pseudo first-order reaction where excess water keeps its activity constant; rate depends solely on ester concentration[cite: 53].",
                chemicals: "Hydrochloric Acid ($\text{HCl}$), Sodium Hydroxide ($\text{NaOH}$), Ethyl acetate, Phenolphthalein[cite: 53, 54].",
                apparatus: "Thermostat ($25^\circ\text{C}$), Burette, Conical flask, Pipette, Stopwatch[cite: 54]."
            },
            {
                id: 9,
                title: "To determine the electrochemical equivalent (ECE) of copper",
                objective: "To determine the electrochemical equivalent ($Z$) of copper using a copper voltameter and Faraday's first law of electrolysis[cite: 60, 62].",
                theory: "Mass deposited $W = Z \cdot I \cdot t$, where $Z$ is the electrochemical equivalent[cite: 60].",
                chemicals: "Copper electrodes, 15% $\text{CuSO}_4$ & 5% $\text{H}_2\text{SO}_4$ solution[cite: 60].",
                apparatus: "Copper voltameter, Ammeter, Rheostat, DC source, Stopwatch[cite: 60, 61]."
            }
        ];

        let currentExpId = 1;

        function renderNav() {
            const nav = document.getElementById('experimentNav');
            nav.innerHTML = experiments.map(exp => `
                <button onclick="switchExperiment(${exp.id})" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium transition flex items-center space-x-2.5 ${currentExpId === exp.id ? 'bg-emerald-600 text-white shadow-md shadow-emerald-900/30' : 'text-slate-300 hover:bg-slate-700/50 hover:text-white'}">
                    <span class="w-6 h-6 rounded-lg bg-slate-900/30 flex items-center justify-center font-bold text-[11px] shrink-0">0${exp.id}</span>
                    <span class="truncate">Exp ${exp.id}: ${exp.title}</span>
                </button>
            `).join('');
        }

        function switchExperiment(id) {
            currentExpId = id;
            renderNav();
            renderWorkspace();
            lucide.createIcons();
        }

        function renderWorkspace() {
            const exp = experiments.find(e => e.id === currentExpId);
            const ws = document.getElementById('experimentWorkspace');
            
            ws.innerHTML = `
                <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-6">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                        <div>
                            <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Experiment No. ${exp.id}</span>
                            <h2 class="text-xl font-bold text-white mt-1">${exp.title}</h2>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-slate-900/50 border border-slate-700/60 rounded-xl p-4">
                            <h3 class="text-xs font-semibold uppercase text-emerald-400 flex items-center space-x-2">
                                <i data-lucide="target" class="w-4 h-4"></i>
                                <span>Aim & Objective</span>
                            </h3>
                            <p class="text-sm text-slate-300 mt-2 leading-relaxed">${exp.objective}</p>
                        </div>
                        <div class="bg-slate-900/50 border border-slate-700/60 rounded-xl p-4">
                            <h3 class="text-xs font-semibold uppercase text-emerald-400 flex items-center space-x-2">
                                <i data-lucide="book-open" class="w-4 h-4"></i>
                                <span>Theoretical Background</span>
                            </h3>
                            <p class="text-sm text-slate-300 mt-2 leading-relaxed">${exp.theory}</p>
                        </div>
                    </div>

                    <div class="bg-slate-900/80 border border-slate-700 rounded-2xl p-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                                <i data-lucide="play-circle" class="w-5 h-5 text-emerald-400"></i>
                                <span>Interactive Laboratory Station & Step-by-Step Animation</span>
                            </h3>
                            <span class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-medium">Live Simulation</span>
                        </div>

                        <div id="animationContainer" class="bg-slate-950 border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center min-h-[320px] relative overflow-hidden">
                            <!-- Dynamic Simulation Stage -->
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                        <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-4">
                            <span class="text-xs font-semibold text-slate-400 uppercase">Chemicals Required</span>
                            <p class="text-xs text-slate-300 mt-1">${exp.chemicals}</p>
                        </div>
                        <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-4">
                            <span class="text-xs font-semibold text-slate-400 uppercase">Apparatus</span>
                            <p class="text-xs text-slate-300 mt-1">${exp.apparatus}</p>
                        </div>
                    </div>
                </div>
            `;

            renderSimulation(currentExpId);
            lucide.createIcons();
        }

        function renderSimulation(id) {
            const container = document.getElementById('animationContainer');
            if (!container) return;

            if (id === 1) {
                // Exp 1: Ostwald Viscometer Animation
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="relative w-64 h-64 bg-slate-900 border border-slate-700/60 rounded-xl flex items-center justify-center shadow-inner">
                            <svg class="w-48 h-48" viewBox="0 0 200 200">
                                <!-- Ostwald Viscometer U-Tube SVG -->
                                <path d="M70,30 L70,140 C70,165 130,165 130,140 L130,30" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
                                <circle cx="100" cy="90" r="22" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
                                <line x1="75" y1="75" x2="125" y2="75" stroke="#34d399" stroke-width="2" stroke-dasharray="2,2"/>
                                <text x="132" y="78" fill="#34d399" font-size="8">Upper Mark A[cite: 8]</text>
                                <line x1="75" y1="110" x2="125" y2="110" stroke="#f87171" stroke-width="2" stroke-dasharray="2,2"/>
                                <text x="132" y="113" fill="#f87171" font-size="8">Lower Mark B[cite: 8]</text>
                                <!-- Liquid Level Indicator -->
                                <rect id="viscoLiquid" x="127" y="130" width="6" height="20" fill="#38bdf8" rx="3" />
                            </svg>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button onclick="startViscoAnim()" id="viscoBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow-md transition">Start Flow Time Simulation</button>
                            <div id="viscoTimer" class="text-xs font-mono bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-emerald-400">Time t: 0.0 s[cite: 7, 9]</div>
                        </div>
                    </div>
                `;
            } else if (id === 2) {
                // Exp 2: Nylon 6,10 Interfacial Polymerization Animation
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="relative w-72 h-56 bg-slate-900 border border-slate-700/60 rounded-xl flex flex-col items-center justify-end p-4">
                            <!-- Beaker & Layers -->
                            <div class="w-40 h-36 border-2 border-t-0 border-slate-400 rounded-b-2xl relative overflow-hidden flex flex-col">
                                <div id="nylonOrgLayer" class="h-1/2 bg-amber-900/40 w-full flex items-center justify-center text-[10px] text-amber-300">Sebacoyl Chloride in CCl₄[cite: 13, 14]</div>
                                <div id="nylonAqLayer" class="h-1/2 bg-cyan-900/40 w-full flex items-center justify-center text-[10px] text-cyan-300">HMDA in Aqueous Layer[cite: 13, 14]</div>
                                <!-- Interfacial Thread -->
                                <div id="nylonThread" class="absolute bottom-1/2 left-1/2 -translate-x-1/2 w-1.5 h-0 bg-white rounded-full transition-all duration-1000"></div>
                            </div>
                            <!-- Glass Rod -->
                            <div id="glassRod" class="absolute top-6 w-48 h-2 bg-slate-300 rounded-full shadow-md hidden"></div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="startNylonAnim()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow-md transition">Pull Nylon Thread (Rope Trick)</button>
                        </div>
                    </div>
                `;
            } else if (id === 3) {
                // Exp 3: Colorimeter / Iron Concentration
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="flex items-center space-x-6">
                            <div class="w-16 h-28 bg-rose-900/60 border border-rose-500/50 rounded-lg flex items-center justify-center text-xs font-bold text-white shadow-lg animate-pulse-slow">
                                [Fe(SCN)₃][cite: 20]
                            </div>
                            <div class="text-left space-y-2">
                                <span class="text-xs text-slate-400 block">Wavelength: $\lambda_{max} = 450\text{ nm}$[cite: 20]</span>
                                <span class="text-xs text-emerald-400 block font-mono">Absorbance (A) = $\epsilon \cdot c \cdot l$[cite: 20]</span>
                                <input type="range" min="0.01" max="0.10" step="0.01" value="0.04" oninput="updateColorimeter(this.value)" class="w-40 accent-emerald-500">
                                <div id="colorimeterVal" class="text-xs text-white font-mono">Concentration: 0.04 mg/ml[cite: 22, 23]</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (id === 4) {
                // Exp 4: Metal Corrosion Animation
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="flex space-x-4">
                            <div class="w-20 h-40 bg-slate-900 border border-slate-700 rounded-lg relative overflow-hidden flex flex-col justify-end p-2">
                                <div class="h-3/4 bg-amber-700/40 w-full rounded flex items-center justify-center text-[10px] text-amber-200">1N H₂SO₄[cite: 29]</div>
                                <div class="absolute top-6 left-1/2 -translate-x-1/2 w-3 h-24 bg-slate-400 rounded"></div>
                            </div>
                            <div class="w-20 h-40 bg-slate-900 border border-slate-700 rounded-lg relative overflow-hidden flex flex-col justify-end p-2">
                                <div class="h-3/4 bg-amber-700/70 w-full rounded flex items-center justify-center text-[10px] text-amber-200">4N H₂SO₄[cite: 29]</div>
                                <div class="absolute top-6 left-1/2 -translate-x-1/2 w-3 h-24 bg-amber-600/60 rounded animate-pulse"></div>
                            </div>
                        </div>
                        <p class="text-xs text-slate-400">Higher acid concentration accelerates galvanic iron dissolution and hydrogen evolution[cite: 27, 29].</p>
                    </div>
                `;
            } else if (id === 5) {
                // Exp 5: Coal Proximate Analysis
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
                            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl text-center space-y-2">
                                <div class="text-xs font-bold text-amber-400">Electric Oven ($110^\circ\text{C}$)[cite: 34]</div>
                                <button onclick="runCoalTest(1)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs">Determine Moisture[cite: 34]</button>
                                <div id="moistureResult" class="text-xs text-slate-300 font-mono">Loss: --</div>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl text-center space-y-2">
                                <div class="text-xs font-bold text-rose-400">Muffle Furnace ($750^\circ\text{C}$)[cite: 34]</div>
                                <button onclick="runCoalTest(2)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs">Determine Ash[cite: 34]</button>
                                <div id="ashResult" class="text-xs text-slate-300 font-mono">Residue: --</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (id === 6) {
                // Exp 6: pH Meter Titration
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="w-full max-w-md bg-slate-900 border border-slate-700 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between text-xs text-slate-300">
                                <span>Titration: $\text{CH}_3\text{COOH}$ vs $\text{NaOH}$[cite: 39, 41]</span>
                                <span class="text-emerald-400 font-bold" id="phDisplay">pH: 2.88[cite: 41]</span>
                            </div>
                            <input type="range" min="0" max="40" value="0" step="2" oninput="updatepHCurve(this.value)" class="w-full accent-emerald-500">
                            <div class="text-[11px] text-slate-400 text-center">Equivalence point inflection at ~25 mL $\text{NaOH}$[cite: 41]</div>
                        </div>
                    </div>
                `;
            } else if (id === 7) {
                // Exp 7: TLC
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="w-32 h-48 bg-slate-900 border border-slate-700 rounded-xl relative p-2 flex flex-col items-center justify-between">
                            <div class="w-full h-1 bg-slate-600"></div>
                            <div class="space-y-4 my-auto">
                                <div class="w-3 h-3 bg-rose-500 rounded-full shadow-lg"></div>
                                <div class="w-3 h-3 bg-amber-400 rounded-full shadow-lg"></div>
                            </div>
                            <div class="w-full h-1 bg-emerald-500"></div>
                        </div>
                        <p class="text-xs text-slate-400">Silica gel TLC plate showing separated organic spots[cite: 47, 48]. $R_f = \frac{\text{Spot distance}}{\text{Solvent front}}$[cite: 48]</p>
                    </div>
                `;
            } else if (id === 8) {
                // Exp 8: Ester Hydrolysis
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="w-full max-w-md bg-slate-900 border border-slate-700 p-4 rounded-xl text-center space-y-3">
                            <div class="text-xs font-bold text-emerald-400">Thermostat ($25^\circ\text{C}$) - Acid Catalyzed Ester Hydrolysis[cite: 54]</div>
                            <button onclick="runEsterKinetics()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Run Kinetic Titrations ($V_0$ to $V_\infty$)[cite: 54]</button>
                            <div id="esterOutput" class="text-xs font-mono text-slate-300">Rate Constant $K = 1.18 \times 10^{-3} \text{ min}^{-1}$[cite: 54, 55]</div>
                        </div>
                    </div>
                `;
            } else if (id === 9) {
                // Exp 9: ECE of Copper
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-4 w-full">
                        <div class="w-full max-w-md bg-slate-900 border border-slate-700 p-4 rounded-xl text-center space-y-3">
                            <div class="text-xs font-bold text-cyan-400">Copper Voltameter Circuit[cite: 60]</div>
                            <button onclick="runECE()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Start Current ($I = 0.5\text{A}, t = 45\text{ min}$)[cite: 61]</button>
                            <div id="eceOutput" class="text-xs font-mono text-slate-300">Calculated $Z = 0.000328\text{ g/C}$[cite: 62]</div>
                        </div>
                    </div>
                `;
            }
        }

        // Animation Triggers
        function startViscoAnim() {
            const liquid = document.getElementById('viscoLiquid');
            const timer = document.getElementById('viscoTimer');
            if(!liquid || !timer) return;
            
            liquid.style.transform = "translateY(-40px)";
            timer.innerText = "Suction: filling to Upper Mark A[cite: 8]...";
            
            setTimeout(() => {
                timer.innerText = "Flow started! Timing...";
                let t = 0.0;
                liquid.style.transition = "transform 4s linear";
                liquid.style.transform = "translateY(0px)";
                
                let interval = setInterval(() => {
                    t += 0.5;
                    timer.innerText = `Time t: ${t.toFixed(1)} s[cite: 7, 9]`;
                    if (t >= 4.0) {
                        clearInterval(interval);
                        timer.innerText = `Flow Complete! Mean t = 54.2 s[cite: 9]`;
                    }
                }, 500);
            }, 1200);
        }

        function startNylonAnim() {
            const thread = document.getElementById('nylonThread');
            const rod = document.getElementById('glassRod');
            if(!thread || !rod) return;

            rod.classList.remove('hidden');
            thread.style.height = "80px";
            setTimeout(() => {
                alert("Nylon 6,10 thread successfully drawn and wrapped around glass rod[cite: 14]!");
            }, 1000);
        }

        function updateColorimeter(val) {
            document.getElementById('colorimeterVal').innerText = `Concentration: ${val} mg/ml[cite: 22, 23]`;
        }

        function runCoalTest(type) {
            if(type === 1) {
                document.getElementById('moistureResult').innerText = "Moisture Loss: 1.25%";
            } else {
                document.getElementById('ashResult').innerText = "Ash Residue: 4.80%";
            }
        }

        function updatepHCurve(vol) {
            let ph = (1 + (vol / 4.5)).toFixed(2);
            if(vol >= 24 && vol <= 26) ph = "7.00 (Equivalence Point)[cite: 41]";
            document.getElementById('phDisplay').innerText = `NaOH added: ${vol} mL | pH: ${ph}[cite: 41]`;
        }

        function runEsterKinetics() {
            document.getElementById('esterOutput').innerText = "Titration completed. Mean K = 1.24 × 10⁻³ min⁻¹[cite: 54, 55]";
        }

        function runECE() {
            document.getElementById('eceOutput').innerText = "Deposition complete. W = 0.442g, Z = 0.000328 g/C[cite: 61, 62]";
        }

        function exportCurrentReport() {
            const element = document.getElementById('experimentWorkspace');
            html2pdf().from(element).save(`MITWPU_ChemLab_Exp_${currentExpId}.pdf`);
        }

        // Initialize on load
        window.onload = () => {
            renderNav();
            renderWorkspace();
        };
    </script>
</body>
</html>
